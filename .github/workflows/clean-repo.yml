name: 🚨 一键清空本仓库 Release 和 Tag

on:
  workflow_dispatch: # 仅允许手动点击触发

jobs:
  clean-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Delete All Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MY_REPO="${{ github.repository }}"
          echo "开始清理仓库: $MY_REPO"

          # 1. 获取并删除所有 Release
          echo "正在获取所有 Release..."
          RELEASES=$(gh api "repos/$MY_REPO/releases?per_page=100" --jq '.[] | .tag_name')
          
          for TAG in $RELEASES; do
            echo "正在删除 Release: $TAG"
            gh release delete "$TAG" --repo "$MY_REPO" --yes || true
          done

          # 2. 获取并删除所有 Git Tags（本地和远程）
          echo "正在强制删除所有 Git Tags..."
          # 获取远程所有 tag
          git fetch --tags
          TAGS=$(git tag)
          
          for T in $TAGS; do
            echo "正在删除本地/远程 Tag: $T"
            git tag -d "$T" || true
            git push origin :refs/tags/"$T" || true
          done

          echo "🎉 清理全部完成！仓库现在是干净的了。"
